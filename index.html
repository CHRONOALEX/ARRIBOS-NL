<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arribos NLD3</title>
<style>
  :root{
    /* Traxion palette */
    --tx-green: #d4e600;
    --tx-green-dark: #b8c900;
    --tx-dark: #2d2d2d;
    --tx-gray: #4a4a4a;
    --tx-light: #f4f5f7;
    --tx-white: #ffffff;

    --bg: #f0f2f5;
    --panel: #ffffff;
    --panel-border: #e0e4e8;
    --text: #1e293b;
    --muted: #6b7a8f;
    --cyan: #2563eb;
    --cyan-dim: #93c5fd;
    --badge: #2563eb;
    --good: #16a34a;
    --warn: #d97706;
    --bad: #dc2626;
    --hover-col: rgba(37, 99, 235, 0.08);
    --hover-col-border: rgba(37, 99, 235, 0.25);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;}
  body{padding:0 0 18px 0;}

  /* ---- TRAXION HEADER ---- */
  .tx-header{
    background: var(--tx-dark);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    border-bottom: 4px solid var(--tx-green);
    box-shadow: 0 2px 8px rgba(0,0,0,.12);
  }
  .tx-logo{display:flex;flex-direction:column;line-height:1;}
  .tx-logo .tx-wordmark{
    font-size: 26px;
    font-weight: 900;
    letter-spacing: 4px;
    color: var(--tx-green);
    text-transform: uppercase;
    font-family: "Arial Black", "Segoe UI", sans-serif;
  }
  .tx-logo .tx-tagline{
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 3px;
    color: #9a9a9a;
    text-transform: uppercase;
    margin-top: 2px;
  }
  .tx-header .tx-page-title{
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .12em;
    color: #e0e4e8;
    text-transform: uppercase;
  }
  .tx-header .tx-page-title span{color: var(--tx-green);}

  .wrap{
    max-width:1320px;
    margin:0 auto;
    padding: 18px 18px 0;
    display:flex;
    flex-direction:column;
    gap:16px;
  }

  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:12px;
    padding:4px 2px 8px;
  }
  .topbar h1{
    font-size:15px;
    letter-spacing:.08em;
    font-weight:700;
    color:var(--text);
    margin:0;
    text-transform:uppercase;
  }
  .topbar h1 span{color:var(--cyan);}

  select#mesSelect{
    background:var(--panel);
    border:1px solid var(--panel-border);
    color:var(--text);
    padding:9px 14px;
    border-radius:8px;
    font-size:13px;
    font-weight:600;
    outline:none;
    cursor:pointer;
    box-shadow:0 1px 3px rgba(0,0,0,.04);
  }
  select#mesSelect:focus{border-color:var(--cyan-dim);}

  .card{
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:14px;
    padding:20px 22px 14px;
    box-shadow:0 1px 3px rgba(15,23,42,.06);
  }
  .card-head{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:12px;
    font-weight:700;
    letter-spacing:.08em;
    color:var(--muted);
    text-transform:uppercase;
  }
  .card-head .ico{font-size:14px;}
  .divider{
    height:1px;
    background:linear-gradient(90deg, rgba(37,99,235,.15), rgba(37,99,235,0));
    margin:14px 0 18px;
  }

  .metric{text-align:center;margin-bottom:6px;}
  .metric .num{
    font-size:44px;
    font-weight:800;
    color:var(--cyan);
    line-height:1;
    letter-spacing:.01em;
  }
  .metric .label{
    margin-top:6px;
    font-size:11px;
    font-weight:700;
    letter-spacing:.1em;
    color:var(--muted);
    text-transform:uppercase;
  }

  .legend{
    display:flex;
    justify-content:center;
    gap:18px;
    margin:4px 0 4px;
    font-size:10.5px;
    color:var(--muted);
    font-weight:600;
    letter-spacing:.03em;
  }
  .legend span.dot{
    display:inline-block;
    width:8px;
    height:8px;
    border-radius:50%;
    margin-right:5px;
    vertical-align:middle;
  }

  .chart-wrap{position:relative;width:100%;}
  svg{width:100%;height:auto;display:block;overflow:visible;}

  /* ---- chart elements ---- */
  .grid-line{stroke:rgba(15,23,42,.08);stroke-width:1;}
  .axis-label{fill:var(--muted);font-size:10px;}
  .date-label{fill:var(--muted);font-size:9px;}
  .area-path{fill:url(#areaGrad);}
  .line-path{
    fill:none;
    stroke:var(--cyan);
    stroke-width:2.5;
    stroke-linecap:round;
    stroke-linejoin:round;
  }
  .pt{
    fill:var(--bg);
    stroke:var(--cyan);
    stroke-width:2.5;
    transition: r .15s ease;
  }
  .badge-bg{fill:var(--badge);}
  .badge-text{fill:#ffffff;font-size:10px;font-weight:700;text-anchor:middle;}
  .perf-text{font-size:9.5px;font-weight:800;text-anchor:middle;}
  .paq-text{fill:#475569;font-size:9px;font-weight:700;text-anchor:middle;}

  /* ---- interactive hover column ---- */
  .hover-col{
    fill: var(--hover-col);
    stroke: var(--hover-col-border);
    stroke-width: 1;
    stroke-dasharray: 4 3;
    opacity: 0;
    transition: opacity .12s ease;
    pointer-events: all;
    cursor: crosshair;
  }
  .hover-col.active{
    opacity: 1;
  }
  .hover-point{
    fill: var(--cyan);
    stroke: #fff;
    stroke-width: 2.5;
    r: 6;
    opacity: 0;
    transition: opacity .12s ease;
    pointer-events: none;
  }
  .hover-point.active{
    opacity: 1;
  }
  .hover-tooltip{
    pointer-events: none;
    opacity: 0;
    transition: opacity .12s ease;
  }
  .hover-tooltip.active{
    opacity: 1;
  }
  .tooltip-bg{
    fill: #1e293b;
    rx: 8;
    ry: 8;
    filter: drop-shadow(0 3px 6px rgba(0,0,0,.18));
  }
  .tooltip-text{
    fill: #fff;
    font-size: 10px;
    font-weight: 700;
    text-anchor: middle;
    font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  }
  .tooltip-sub{
    fill: #cbd5e1;
    font-size: 9px;
    font-weight: 600;
    text-anchor: middle;
    font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  }
  .tooltip-value{
    fill: var(--tx-green);
    font-size: 10px;
    font-weight: 800;
    text-anchor: middle;
    font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  }

  .state{
    padding:40px 10px;
    text-align:center;
    color:var(--muted);
    font-size:13px;
  }
  .state.error{color:#f27272;}

  footer{
    text-align:center;
    color:var(--muted);
    font-size:11px;
    padding:6px 0 0;
  }

  /* ---- responsive ---- */
  @media (max-width: 700px){
    .tx-header{
      padding: 10px 16px;
      flex-direction: column;
      align-items: flex-start;
    }
    .tx-logo .tx-wordmark{font-size: 20px; letter-spacing: 3px;}
    .tx-header .tx-page-title{font-size: 11px;}
    .wrap{padding: 12px 10px 0;}
    .metric .num{font-size: 32px;}
    .card{padding: 14px 12px 10px;}
    .legend{flex-wrap: wrap; gap: 10px;}
  }
</style>
</head>
<body>

<!-- TRAXION HEADER -->
<header class="tx-header">
  <div class="tx-logo">
    <div class="tx-wordmark">TRAXION</div>
    <div class="tx-tagline">VIDA EN MOVIMIENTO</div>
  </div>
  <div class="tx-page-title">📊 Arribos <span>NLD3</span></div>
</header>

<div class="wrap">

  <div class="topbar">
    <h1>📊 Performance <span>SD</span></h1>
    <select id="mesSelect"><option>Cargando meses...</option></select>
  </div>

  <div class="card">
    <div class="card-head"><span class="ico">🕐</span> Hora Arribo (Mes Seleccionado)</div>
    <div class="divider"></div>

    <div class="metric">
      <div class="num" id="totalPaquetes">–</div>
      <div class="label">Paquetes SD en el periodo</div>
    </div>

    <div class="legend">
      <span><span class="dot" style="background:var(--good)"></span>Performance ≥ 98%</span>
      <span><span class="dot" style="background:var(--warn)"></span>Entre 97% y 98%</span>
      <span><span class="dot" style="background:var(--bad)"></span>&lt; 97%</span>
    </div>

    <div class="chart-wrap" id="chartWrap">
      <div class="state" id="state">Cargando datos de la hoja...</div>
    </div>
  </div>

  <footer>Fuente: hoja "ARRIBOS AMAZON · BITACORA" — actualiza al recargar la página</footer>
</div>

<script>
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRTaDKwoxDG0EcyeIvgGCubr0nrUSnFi07nXB4EYnz9GyXqgovHv-0SSS_GwGX1nVO0FV9p1dAyGv0d/pub?output=csv";

let RAW_ROWS = [];
let COLS = { mes:null, fecha:null, hora:null, perf:null, paq:null };

function normalize(s){
  return (s||"").toString().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim().toLowerCase();
}

// ---------- CSV parsing ----------
function parseCSV(text){
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field+='"'; i++; } else { inQuotes=false; }
      } else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field=""; }
      else if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=""; }
      else if(c === '\r'){ /* skip */ }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.some(c => c && c.trim() !== ""));
}

function detectColumns(headers){
  const norm = headers.map(normalize);
  const find = (predicate) => {
    const idx = norm.findIndex(predicate);
    return idx === -1 ? null : idx;
  };
  return {
    mes:   find(h => h.includes("mes")),
    fecha: find(h => h.includes("fecha") && h.includes("arrib")),
    hora:  find(h => h.includes("hora") && h.includes("arrib")),
    perf:  find(h => h.includes("performance")),
    paq:   find(h => h.includes("paquetes")),
  };
}

// ---------- Fecha parsing ----------
function excelSerialToDate(serial){
  const utcDays = Math.floor(serial - 25569);
  const utcValue = utcDays * 86400;
  return new Date(utcValue * 1000);
}
function parseFecha(raw){
  if(raw == null) return null;
  const v = raw.toString().trim();
  if(v === "") return null;
  if(/^\d+(\.\d+)?$/.test(v)){
    const n = parseFloat(v);
    if(n > 20000 && n < 60000) return excelSerialToDate(n);
  }
  let m = v.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
  if(m){
    let [_, d, mo, y] = m;
    if(y.length === 2) y = "20"+y;
    const dt = new Date(parseInt(y), parseInt(mo)-1, parseInt(d));
    if(!isNaN(dt)) return dt;
  }
  m = v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m){
    const [_, y, mo, d] = m;
    const dt = new Date(parseInt(y), parseInt(mo)-1, parseInt(d));
    if(!isNaN(dt)) return dt;
  }
  const dt = new Date(v);
  return isNaN(dt) ? null : dt;
}
function formatFechaCorta(dt){
  return dt.getDate() + "/" + (dt.getMonth()+1);
}
function formatFechaCompleta(dt){
  return dt.getDate().toString().padStart(2,'0') + "/" + (dt.getMonth()+1).toString().padStart(2,'0') + "/" + dt.getFullYear();
}

// ---------- Hora parsing ----------
function parseHora(raw){
  if(raw == null) return null;
  const v = raw.toString().trim();
  if(v === "") return null;

  if(/^\d(\.\d+)?$/.test(v)){
    const n = parseFloat(v);
    if(n >= 0 && n < 1) return n*24;
  }

  let m = v.match(/^(\d{1,2}):(\d{2})(:(\d{2}))?\s*$/);
  if(m){
    const h = parseInt(m[1]), mi = parseInt(m[2]);
    return h + mi/60;
  }

  m = v.match(/^(\d{1,2}):(\d{2})\s*(a\.?\s*m\.?|p\.?\s*m\.?|am|pm)/i);
  if(m){
    let h = parseInt(m[1]); const mi = parseInt(m[2]);
    const ampm = m[3].toLowerCase().replace(/\./g,"").replace(/\s/g,"");
    if(ampm.startsWith("p") && h < 12) h += 12;
    if(ampm.startsWith("a") && h === 12) h = 0;
    return h + mi/60;
  }
  return null;
}
function formatHoraDecimal(hDec){
  let h = Math.floor(hDec);
  let m = Math.round((hDec - h)*60);
  if(m === 60){ m=0; h+=1; }
  h = ((h % 24)+24)%24;
  return String(h).padStart(2,"0")+":"+String(m).padStart(2,"0");
}

// ---------- Performance parsing ----------
function parsePerf(raw){
  if(raw == null) return null;
  let v = raw.toString().trim();
  if(v === "") return null;
  const hadPercent = v.includes("%");
  v = v.replace("%","").replace(",",".").trim();
  const n = parseFloat(v);
  if(isNaN(n)) return null;
  if(hadPercent) return n;
  return n <= 1 ? n*100 : n;
}

// ---------- Paquetes parsing ----------
function parsePaquetes(raw){
  if(raw == null) return 0;
  const v = raw.toString().replace(/[^\d.\-]/g,"").trim();
  const n = parseFloat(v);
  return isNaN(n) ? 0 : n;
}

function perfColor(p){
  if(p == null) return "#9fb3c8";
  if(p < 97) return "var(--bad)";
  if(p < 98) return "var(--warn)";
  return "var(--good)";
}

// ---------- Carga de datos ----------
async function loadData(){
  const res = await fetch(SHEET_CSV_URL, { cache: "no-store" });
  if(!res.ok) throw new Error("HTTP "+res.status);
  const text = await res.text();
  const table = parseCSV(text);
  if(table.length < 2) throw new Error("La hoja no tiene datos suficientes");

  const headers = table[0];
  COLS = detectColumns(headers);
  if(COLS.fecha === null || COLS.hora === null){
    throw new Error("No se encontraron las columnas 'Fecha arribo' y/o 'Hora arribo' en la hoja");
  }

  RAW_ROWS = table.slice(1).map(r => {
    const fecha = parseFecha(r[COLS.fecha]);
    const hora = parseHora(r[COLS.hora]);
    const perf = COLS.perf !== null ? parsePerf(r[COLS.perf]) : null;
    const paq = COLS.paq !== null ? parsePaquetes(r[COLS.paq]) : null;
    const mes = COLS.mes !== null ? (r[COLS.mes]||"").toString().trim() : (fecha ? fecha.toLocaleDateString("es-MX",{month:"long",year:"numeric"}) : "");
    return { fecha, hora, perf, paq, mes, raw:r };
  }).filter(r => r.fecha);
}

function buildMesOptions(){
  const select = document.getElementById("mesSelect");
  const mesKeyOf = r => COLS.mes !== null ? r.mes : (r.fecha.getFullYear()+"-"+String(r.fecha.getMonth()+1).padStart(2,"0"));
  const mesLabelOf = r => COLS.mes !== null ? r.mes : r.fecha.toLocaleDateString("es-MX",{month:"long",year:"numeric"});

  const seen = new Map();
  RAW_ROWS.forEach(r=>{
    const key = mesKeyOf(r);
    if(key && !seen.has(key)) seen.set(key, mesLabelOf(r));
  });

  const order = new Map();
  RAW_ROWS.forEach(r=>{
    const key = mesKeyOf(r);
    if(!order.has(key) || r.fecha < order.get(key)) order.set(key, r.fecha);
  });
  const keys = [...seen.keys()].sort((a,b)=> order.get(a) - order.get(b));

  select.innerHTML = "";
  keys.forEach(k=>{
    const opt = document.createElement("option");
    opt.value = k;
    opt.textContent = seen.get(k);
    select.appendChild(opt);
  });

  if(keys.length){
    select.value = keys[keys.length-1];
  }
  select.addEventListener("change", renderChart);
  select._mesKeyOf = mesKeyOf;
}

function renderChart(){
  const select = document.getElementById("mesSelect");
  const mesKeyOf = select._mesKeyOf;
  const mesElegido = select.value;

  let rowsMes = RAW_ROWS.filter(r => mesKeyOf(r) === mesElegido);
  let rows = rowsMes.filter(r => r.hora !== null);
  rows.sort((a,b)=> a.fecha - b.fecha);

  const totalPaquetes = COLS.paq !== null
    ? rowsMes.reduce((acc,r)=> acc + (r.paq||0), 0)
    : rowsMes.length;
  document.getElementById("totalPaquetes").textContent =
    Number.isInteger(totalPaquetes) ? totalPaquetes : totalPaquetes.toFixed(0);

  const wrap = document.getElementById("chartWrap");
  if(rows.length === 0){
    wrap.innerHTML = '<div class="state">Sin datos de Hora Arribo para este mes.</div>';
    return;
  }

  const porFecha = new Map();
  rows.forEach(r=>{
    const key = r.fecha.toDateString();
    if(!porFecha.has(key)) porFecha.set(key, {fecha:r.fecha, horas:[], perfs:[], paqs:[]});
    const g = porFecha.get(key);
    g.horas.push(r.hora);
    if(r.perf !== null) g.perfs.push(r.perf);
    if(r.paq !== null) g.paqs.push(r.paq);
  });
  const avg = arr => arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : null;
  const puntos = [...porFecha.values()]
    .map(p => ({
      fecha: p.fecha,
      hora: avg(p.horas),
      perf: p.perfs.length ? avg(p.perfs) : null,
      paq: p.paqs.length ? p.paqs.reduce((a,b)=>a+b,0) : null,
    }))
    .sort((a,b)=> a.fecha - b.fecha);

  drawAreaChart(wrap, puntos);
}

function drawAreaChart(container, puntos){
  const W = Math.max(1000, puntos.length * 36), H = 420;
  const padL = 40, padR = 24, padT = 46, padB = 82;
  const plotW = W - padL - padR, plotH = H - padT - padB;

  // ---- AJUSTE: rango de horas dinámico (min-1 a max+2) ----
  const horasArr = puntos.map(p => p.hora).filter(h => h !== null);
  const minReal = Math.min(...horasArr);
  const maxReal = Math.max(...horasArr);
  let minH = Math.floor(minReal) - 1;
  let maxH = Math.ceil(maxReal) + 2;
  if (minH < 0) minH = 0;
  if (maxH > 24) maxH = 24;
  if (maxH - minH < 3) {
    minH = Math.max(0, minH - 1);
    maxH = Math.min(24, maxH + 1);
  }

  const xFor = i => padL + (puntos.length === 1 ? plotW/2 : (i/(puntos.length-1))*plotW);
  const yFor = h => padT + plotH - ((h - minH)/(maxH - minH))*plotH;
  const plotBottom = padT + plotH;

  // path de la línea
  let linePath = "";
  puntos.forEach((p,i)=>{
    const x = xFor(i), y = yFor(p.hora);
    linePath += (i===0? "M":"L") + x.toFixed(1) + " " + y.toFixed(1) + " ";
  });

  let areaPath = linePath + `L ${xFor(puntos.length-1).toFixed(1)} ${plotBottom.toFixed(1)} L ${xFor(0).toFixed(1)} ${plotBottom.toFixed(1)} Z`;

  // grid horizontal
  const gridCount = 5;
  let gridLines = "", gridLabels = "";
  for(let g=0; g<=gridCount; g++){
    const val = minH + ((maxH - minH)/gridCount)*g;
    const y = yFor(val);
    gridLines += `<line class="grid-line" x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}"/>`;
    gridLabels += `<text class="axis-label" x="${padL-8}" y="${(y+3).toFixed(1)}" text-anchor="end">${Math.round(val)}</text>`;
  }

  // posiciones Y para textos inferiores
  const yPerf = plotBottom + 22;
  const yPaq  = plotBottom + 38;
  const yDate = plotBottom + 58;

  // construir puntos, badges, overlays, etiquetas
  let points = "", badges = "", overlays = "", xLabels = "";
  puntos.forEach((p,i)=>{
    const x = xFor(i), y = yFor(p.hora);
    points += `<circle class="pt" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4.5"/>`;

    const label = formatHoraDecimal(p.hora);
    const bw = 15 + label.length*6.4, bh = 20;
    const by = Math.max(2, y - bh - 10);
    badges += `<rect class="badge-bg" x="${(x-bw/2).toFixed(1)}" y="${by.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh}" rx="6"/>`;
    badges += `<text class="badge-text" x="${x.toFixed(1)}" y="${(by+bh/2+3.6).toFixed(1)}">${label}</text>`;

    // Performance a 2 decimales
    if(p.perf !== null){
      overlays += `<text class="perf-text" x="${x.toFixed(1)}" y="${yPerf.toFixed(1)}" fill="${perfColor(p.perf)}">${p.perf.toFixed(2)}%</text>`;
    }
    if(p.paq !== null){
      overlays += `<text class="paq-text" x="${x.toFixed(1)}" y="${yPaq.toFixed(1)}">${p.paq}</text>`;
    }

    xLabels += `<text class="date-label" x="${x.toFixed(1)}" y="${yDate.toFixed(1)}" text-anchor="middle">${formatFechaCorta(p.fecha)}</text>`;
  });

  // ---- columnas virtuales de hover (desde padT hasta plotBottom) ----
  const colWidth = puntos.length > 1 ? (xFor(1) - xFor(0)) : plotW * 0.6;
  let hoverCols = "";
  puntos.forEach((p,i)=>{
    const x = xFor(i);
    const colX = x - colWidth/2;
    hoverCols += `<rect class="hover-col" data-index="${i}" x="${colX.toFixed(1)}" y="${padT}" width="${colWidth.toFixed(1)}" height="${plotH}" />`;
  });

  // ---- puntos de hover (círculos grandes) ----
  let hoverPoints = "";
  puntos.forEach((p,i)=>{
    const x = xFor(i), y = yFor(p.hora);
    hoverPoints += `<circle class="hover-point" data-index="${i}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="7" />`;
  });

  // ---- tooltips con datos completos ----
  let tooltips = "";
  puntos.forEach((p,i)=>{
    const x = xFor(i), y = yFor(p.hora);
    const label = formatHoraDecimal(p.hora);
    const perfStr = p.perf !== null ? p.perf.toFixed(2)+'%' : '—';
    const paqStr = p.paq !== null ? p.paq : '—';
    const fechaStr = formatFechaCompleta(p.fecha);
    const tw = 158, th = 62;
    let tx = x - tw/2;
    if (tx < 2) tx = 2;
    if (tx + tw > W - 2) tx = W - tw - 2;
    const ty = Math.max(4, y - th - 18);
    tooltips += `<g class="hover-tooltip" data-index="${i}">
      <rect class="tooltip-bg" x="${tx.toFixed(1)}" y="${ty.toFixed(1)}" width="${tw}" height="${th}" rx="8" />
      <text class="tooltip-text" x="${(tx+tw/2).toFixed(1)}" y="${(ty+15).toFixed(1)}">${fechaStr}</text>
      <text class="tooltip-sub" x="${(tx+tw/2).toFixed(1)}" y="${(ty+30).toFixed(1)}">Performance SameDay: <tspan class="tooltip-value">${perfStr}</tspan></text>
      <text class="tooltip-sub" x="${(tx+tw/2).toFixed(1)}" y="${(ty+45).toFixed(1)}">Hora Arribo: <tspan class="tooltip-value">${label}</tspan>  ·  Paquetes SD: <tspan class="tooltip-value">${paqStr}</tspan></text>
    </g>`;
  });

  container.innerHTML = `
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" id="chartSvg">
      <defs>
        <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.30"/>
          <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
        </linearGradient>
      </defs>
      ${gridLines}
      ${gridLabels}
      <path class="area-path" d="${areaPath}"/>
      <path class="line-path" d="${linePath}"/>
      ${points}
      ${badges}
      ${overlays}
      ${xLabels}
      ${hoverCols}
      ${hoverPoints}
      ${tooltips}
    </svg>
  `;

  // ---- interacción hover ----
  const svg = container.querySelector('#chartSvg');
  if (!svg) return;
  const cols = svg.querySelectorAll('.hover-col');
  const hPoints = svg.querySelectorAll('.hover-point');
  const tooltipsEls = svg.querySelectorAll('.hover-tooltip');

  function activateIndex(idx){
    cols.forEach((el,i)=> el.classList.toggle('active', i === idx));
    hPoints.forEach((el,i)=> el.classList.toggle('active', i === idx));
    tooltipsEls.forEach((el,i)=> el.classList.toggle('active', i === idx));
  }
  function deactivateAll(){
    cols.forEach(el => el.classList.remove('active'));
    hPoints.forEach(el => el.classList.remove('active'));
    tooltipsEls.forEach(el => el.classList.remove('active'));
  }

  cols.forEach((col) => {
    col.addEventListener('mouseenter', (e) => {
      const idx = parseInt(e.target.dataset.index, 10);
      if (!isNaN(idx)) activateIndex(idx);
    });
    col.addEventListener('mouseleave', () => {
      deactivateAll();
    });
  });

  hPoints.forEach((pt) => {
    pt.addEventListener('mouseenter', (e) => {
      const idx = parseInt(e.target.dataset.index, 10);
      if (!isNaN(idx)) activateIndex(idx);
    });
    pt.addEventListener('mouseleave', () => {
      deactivateAll();
    });
  });
}

async function init(){
  try{
    await loadData();
    document.getElementById("state").remove();
    buildMesOptions();
    renderChart();
  }catch(err){
    console.error(err);
    document.getElementById("chartWrap").innerHTML =
      '<div class="state error">No se pudieron cargar los datos de la hoja.<br>'+
      'Verifica que esté publicada como CSV y accesible.<br><span style="opacity:.7;font-size:11px">'+err.message+'</span></div>';
    document.getElementById("mesSelect").innerHTML = '<option>Sin datos</option>';
  }
}
init();
</script>
</body>
</html>
